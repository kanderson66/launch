{% extends "layout.html" %}
{% block contents %}
    <form action="{{ url_for('update_contents', filename=filename) }}" method="post">
        <p><label for="file_contents">Edit content of {{ filename }}:</label></p>
        <p><textarea name="file_contents">{{ contents }}</textarea></p>
        <input type="submit" value="Save changes">
    </form>
{% endblock %}
