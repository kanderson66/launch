{% extends "layout.html" %}

{% block title %}
    <title>The Adventures of Sherlock Holmes</title>
{% endblock %}


{% block content %}
<h2 class="content-subhead">Table of Contents</h2>

<div class="pure-menu">
    <ul class="pure-menu-list">
        {% for item in toc %}
            <li class="pure-menu-item">
                <a href="{{ url_for('chapters', page_num=loop.index)}}" class="pure-menu-link">{{ item }}</a>
            </li>
        {% endfor %}
    </ul>
</div>
{% endblock %}
