{% extends 'layout.html' %}

{% block content %}
    <section id="todos">
        <header> <!-- header contains title, delete list button -->
            <h2>Editing '{{ desired_list.title }}'</h2>
            <ul>
                <form class="delete" action="{{ url_for('delete_list', lst_id=desired_list.id) }}" method="post">
                    <button type="submit" class="delete">Delete List</button>
                </form>
            </ul>
        </header>
    </section>

    <!-- Change name of list -->
    <form action="{{ url_for('rename_list', lst_id=desired_list.id) }}" method="post">
        <dl>
            <dt>
                <label for="list_title">Enter the new title for the list:</label>
            </dt>
            <dd>
                <input type="text" name="list_title" placeholder="" 
                value="{{ request.form['list_title'] 
                    if request.form['list_title'] == '' 
                        or request.form['list_title'] 
                    else desired_list.title }}">
            </dd>
        </dl>
        <fieldset class="actions">
            <input type="submit" value="Save">
            <a href="{{ url_for('list_items', lst_id=desired_list.id) }}">Cancel</a>
        </fieldset> 
    </form>
{% endblock %}
